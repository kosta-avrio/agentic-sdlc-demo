name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Review this pull request as a senior engineer on a transit fare system.
            Focus on:
            - Correctness bugs: money arithmetic, date/time handling, off-by-one
              errors, boundary conditions (zone counts, fare caps, expiry dates)
            - Missing input validation on API endpoints
            - Security issues
            - Missing or weak test coverage for changed code

            Report every issue you find, including ones you are uncertain about or
            consider low-severity. For each finding include your confidence and an
            estimated severity. Post findings as inline comments on the relevant
            lines, plus a short summary comment.
          claude_args: |
            --max-turns 12
            --allowedTools mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep
